# The Kwak Software licence signer. Deploy from this folder with `npx wrangler@4 deploy`.
# Secrets are set with `npx wrangler@4 secret put <NAME>` and never go in this file (see README.md).
name = "kwak-licence-signer"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Errors (order ids only, never names or emails) show in the dashboard under Workers > Logs.
[observability]
enabled = true

[vars]
# "sandbox" while testing with Paddle's sandbox; "live" for real sales.
PADDLE_ENV = "sandbox"
EMAIL_FROM = "Kwak Software <licences@kwaksoftware.ca>"
SUPPORT_EMAIL = "support@kwaksoftware.ca"
# The public half of the key pair from `kwak-license new-keys`, the same one built into the apps.
# The signer checks every key with it before emailing. This is the published TEST key: replace it.
KWAK_PUBLIC_KEY = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEk8mM/WsMR66P4M+XLmMwtDwdDXmbcnmZL07XvdsbTV9HEZyFGHg5ZgXckpU8U/gC5Gj+hw8rmopAGrZFHTv3aQ=="
# Paddle product ids (Catalog > Products) to apps. "major" defaults to 1; "download" is optional.
PRODUCTS = '''
{
  "pro_REPLACE_pecan":    { "app": "pecan",    "download": "https://kwaksoftware.ca/pecan/" },
  "pro_REPLACE_rekarver": { "app": "rekarver", "download": "https://kwaksoftware.ca/rekarver/" },
  "pro_REPLACE_purrsor":  { "app": "purrsor" },
  "pro_REPLACE_phono":    { "app": "phono" }
}
'''
